[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoq"
version = "0.1.0"
description = "A CLI tool for invoking tasks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "anyio>=4.0.0",
]

[project.scripts]
invoq = "invoq.main:app"

[tool.setuptools.packages.find]
where = ["src"]
