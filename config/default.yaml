llm:
  backend: "ollama"       # ollama | llamacpp | llamafile
  model: "auto"           # auto-detect based on RAM, or a specific model name
  api_url: "http://localhost:11434"

execution:
  require_confirmation: true
  show_command_explanation: true
  allow_sudo_bypass: true

security:
  remediation_mode: true

extensions:
  enabled:
    - "git"
